<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Scan — CropPulse</title><link rel="icon" href="logo.ico"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><nav><a class="logo" href="index.html"><img src="logo.png" alt=""><span class="brand-text">CropPulse</span></a><div class="nav-links"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a></div></nav>
<main><form id="bookingForm" class="booking-card card"><span class="eyebrow">Field scan request</span><h1 style="margin:12px 0 4px">Book a CropPulse scan</h1><p class="section-sub">Submit your farm details for a drone + targeted ground inspection.</p><div class="form-grid"><div class="form-group"><label class="form-label">Farmer name</label><input class="form-input" id="farmer" required placeholder="Your name"></div><div class="form-group"><label class="form-label">Mobile number</label><input class="form-input" id="mobile" required inputmode="tel" placeholder="+91 …"></div><div class="form-group full"><label class="form-label">Farm location</label><input class="form-input" id="location" required placeholder="Village / Mandal / District"></div><div class="form-group"><label class="form-label">Preferred date</label><input class="form-input" id="date" type="date" required></div><div class="form-group"><label class="form-label">Approx. area (acres)</label><input class="form-input" id="area" type="number" min="0.1" step="0.1" placeholder="e.g. 3.5"></div><div class="form-group full"><label class="form-label">Main concern</label><select class="form-select" id="concern"><option>General crop health</option><option>Water stress</option><option>Pest / disease symptoms</option><option>Nutrient issue</option></select></div></div><button class="btn btn-primary" type="submit">Confirm booking request</button><div id="msg"></div></form></main><script>document.getElementById('date').min=new Date().toISOString().slice(0,10);document.getElementById('bookingForm').addEventListener('submit',e=>{e.preventDefault();const ref='CP-'+Date.now().toString().slice(-6);document.getElementById('msg').innerHTML=`<div class="success-box">Booking request saved on this device. Reference: <strong>${ref}</strong></div>`;localStorage.setItem('croppulse_booking',JSON.stringify({ref,farmer:farmer.value,mobile:mobile.value,location:document.getElementById('location').value,date:date.value,area:area.value,concern:concern.value}));});</script></body></html>
