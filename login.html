<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign in — CropPulse</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"></head><body class="auth-page"><section class="auth-card"><a class="auth-brand" href="index.html"><img src="assets/logo.png" alt="CropPulse"><span>Crop<span style="color:var(--green)">Pulse</span></span></a><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Sign in to access your field intelligence workspace.</p><div id="phoneBox"><label class="auth-label">Phone number</label><div class="phone-row"><select id="country" class="auth-input"><option value="+91">+91</option><option value="+1">+1</option><option value="+44">+44</option><option value="+61">+61</option></select><input id="phone" class="auth-input" inputmode="tel" placeholder="9876543210"></div><div id="recaptcha-container" class="recaptcha-wrap"></div><button id="sendOtp" class="btn btn-primary auth-btn">Send real OTP</button></div><div id="otpBox" class="otp-area"><label class="auth-label">6-digit verification code</label><input id="otp" class="auth-input" inputmode="numeric" maxlength="6" placeholder="Enter OTP"><p class="otp-hint">The verification code is sent by Firebase to the phone number you entered.</p><button id="verifyOtp" class="btn btn-primary auth-btn">Verify & continue</button><a href="#" id="changeNumber" class="back-link">← Change phone number</a></div><div class="auth-divider">OR</div><button id="googleBtn" class="btn google-btn">Continue with Google</button><p id="authMessage" class="auth-message"></p><a class="back-link" href="index.html">Back to CropPulse</a></section><script>document.getElementById('sendOtp').addEventListener('click',()=>{const c=document.getElementById('country').value;const p=document.getElementById('phone');if(p.value && !p.value.startsWith('+'))p.dataset.full=c+p.value.replace(/\D/g,'');});</script><script>window.addEventListener('DOMContentLoaded',()=>{const p=document.getElementById('phone'),c=document.getElementById('country');document.getElementById('sendOtp').addEventListener('click',()=>{if(p.value && !p.value.startsWith('+'))p.value=c.value+p.value.replace(/\D/g,'');});});</script><script src="firebase-config.js"></script><script type="module" src="auth.js"></script></body></html>
