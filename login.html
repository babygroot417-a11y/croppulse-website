<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign in — CropPulse</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"></head><body class="auth-page"><section class="auth-card"><a class="auth-brand" href="index.html"><img src="assets/logo.png" alt="CropPulse"><span>Crop<span style="color:var(--green)">Pulse</span></span></a><h1 class="auth-title">Welcome back</h1><p class="auth-sub">Sign in to access your field intelligence workspace.</p>
<div id="phoneBox"><label class="auth-label">Phone number</label><div class="phone-row"><select id="country" class="auth-input"><option value="+91">+91</option><option value="+1">+1</option><option value="+44">+44</option><option value="+61">+61</option></select><input id="phone" class="auth-input" inputmode="tel" placeholder="9876543210" autocomplete="tel"></div><div id="recaptcha-container" class="recaptcha-wrap"></div><button id="sendOtp" class="btn btn-primary auth-btn">Send OTP</button></div>
<div id="otpBox" class="otp-area" hidden><label class="auth-label">6-digit verification code</label><input id="otp" class="auth-input" inputmode="numeric" maxlength="6" placeholder="Enter OTP" autocomplete="one-time-code"><p class="otp-hint">A verification code will be sent to your phone.</p><button id="verifyOtp" class="btn btn-primary auth-btn">Verify & continue</button><a href="#" id="changeNumber" class="back-link">← Change phone number</a></div>
<div class="auth-divider">OR</div><button id="googleBtn" class="btn google-btn">Continue with Google</button>
<div class="email-auth"><label class="auth-label">Email</label><input id="email" class="auth-input" type="email" placeholder="you@example.com" autocomplete="email"><label class="auth-label">Password</label><input id="password" class="auth-input" type="password" placeholder="Your password" autocomplete="current-password"><div class="auth-row"><a href="#" id="forgotPassword" class="back-link">Forgot password?</a></div><button id="emailSignIn" class="btn btn-primary auth-btn">Sign in with email</button></div>
<p class="auth-sub">New to CropPulse? <a class="back-link" href="signup.html">Create an account</a></p><p id="authMessage" class="auth-message" role="status"></p><a class="back-link" href="index.html">Back to CropPulse</a></section><script src="firebase-config.js"></script><script type="module" src="auth.js"></script></body></html>
