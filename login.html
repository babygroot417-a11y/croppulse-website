<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — CropPulse</title><link rel="icon" href="logo.ico"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="auth-page">
<div class="auth-card card"><div class="auth-brand"><img src="logo.png" alt="CropPulse"><h1>CropPulse</h1><p>Sign in to your farm dashboard</p></div>
<button id="googleBtn" class="google-btn" type="button">Continue with Google</button><div class="divider">or use mobile OTP</div>
<div id="phoneBox"><div class="form-group"><label class="form-label" for="phone">Mobile number</label><div class="input-row"><select id="countryCode" class="form-select" style="max-width:105px"><option value="+91">+91</option><option value="+1">+1</option><option value="+44">+44</option></select><input id="phone" class="form-input" inputmode="numeric" autocomplete="tel" placeholder="9876543210" maxlength="15"></div></div><div id="recaptcha-container"></div><button id="sendOtpBtn" class="btn btn-primary" style="width:100%" type="button">Send OTP</button></div>
<div id="otpBox" class="hidden"><div class="form-group"><label class="form-label" for="otp">6-digit OTP</label><input id="otp" class="form-input" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter OTP" maxlength="6"></div><button id="verifyOtpBtn" class="btn btn-primary" style="width:100%" type="button">Verify & sign in</button><button id="changeNumberBtn" class="btn btn-secondary" style="width:100%;margin-top:8px" type="button">Change number</button></div>
<div id="authMessage" class="auth-message"></div><p class="demo-note">Phone OTP and Google sign-in use Firebase Authentication. One-time Firebase Console setup is required before they can authenticate real users.</p><a href="index.html" style="display:block;text-align:center;color:var(--muted);margin-top:14px;text-decoration:none">← Back to home</a></div>
<script src="firebase-config.js"></script><script type="module" src="auth.js"></script></body></html>
