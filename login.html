<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CropPulse — Sign in</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="login-card"><a class="login-brand" href="index.html"><img src="assets/logo.png"><span>Crop<span style="color:var(--green)">Pulse</span></span></a><h1>Welcome back</h1><p class="sub">Sign in to access your farm intelligence workspace.</p><div class="field"><label>PHONE NUMBER</label><input id="phone" placeholder="+91 98765 43210"></div><button class="btn full" onclick="sendOTP()">Send OTP</button><div class="divider">OR</div><button class="btn google" onclick="googleLogin()">Continue with Google</button><p id="msg" class="notice">Demo mode: authentication will open the dashboard.</p><a href="index.html" class="notice" style="display:block;margin-top:22px">← Back to CropPulse</a></div><script>function sendOTP(){const p=document.getElementById('phone').value.trim();if(p.length<10){document.getElementById('msg').textContent='Enter a valid phone number.';return}document.getElementById('msg').textContent='OTP flow ready. Opening your workspace for this demo.';setTimeout(()=>location.href='dashboard.html',500)}function googleLogin(){document.getElementById('msg').textContent='Google sign-in is ready to connect to Firebase. Opening demo workspace.';setTimeout(()=>location.href='dashboard.html',500)}</script></body></html>
