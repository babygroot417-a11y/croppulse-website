<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create a new account — CropPulse</title>
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth-fixes.css">
</head>
<body class="auth-page">
<section class="auth-card">
<a class="auth-brand" href="signup.html"><img src="assets/logo.png" alt="CropPulse"><span>Crop<span style="color:var(--green)">Pulse</span></span></a>
<h1 class="auth-title">Create a new account</h1>
<p class="auth-sub">Set up your field intelligence workspace.</p>

<div id="signupForm">
<label class="auth-label">Username</label>
<input id="signupUsername" class="auth-input" type="text" placeholder="Choose a username" autocomplete="username">

<label class="auth-label">Email ID</label>
<input id="signupEmail" class="auth-input" type="email" placeholder="you@example.com" autocomplete="email">

<label class="auth-label">Mobile number</label>
<div class="phone-row"><select id="signupCountry" class="auth-input"><option value="+91">+91</option><option value="+1">+1</option><option value="+44">+44</option><option value="+61">+61</option></select><input id="signupPhone" class="auth-input" inputmode="tel" placeholder="9876543210" autocomplete="tel"></div>

<label class="auth-label">Set a password</label>
<input id="signupPassword" class="auth-input" type="password" placeholder="At least 6 characters" autocomplete="new-password">

<label class="terms-check"><input id="terms" type="checkbox"> <span>I accept the <a href="terms.html" target="_blank">Terms and Conditions</a>.</span></label>
<div id="signupRecaptcha" class="recaptcha-wrap"></div>
<button id="signupSendOtp" class="btn btn-primary auth-btn">Send OTP to mobile</button>
</div>

<div id="signupOtpBox" class="otp-area" hidden>
<label class="auth-label">Mobile OTP</label>
<input id="signupOtp" class="auth-input" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" autocomplete="one-time-code">
<p class="otp-hint">Verify your mobile number to finish creating your account.</p>
<button id="signupVerifyOtp" class="btn btn-primary auth-btn">Verify &amp; create account</button>
<a href="#" id="signupChange" class="back-link">← Change details</a>
</div>

<div class="auth-divider">OR</div>
<div class="auth-google-wrap">
<button id="signupGoogle" class="btn google-btn auth-google">
<svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.27c0-.77-.07-1.51-.22-2.21H12v4.18h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.36z"/><path fill="#34A853" d="M12 21.92c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.98 9.98 0 0 0 12 21.92z"/><path fill="#FBBC05" d="M6.54 14a5.86 5.86 0 0 1 0-3.73V7.74H3.3a9.98 9.98 0 0 0 0 8.8L6.54 14z"/><path fill="#EA4335" d="M12 6.24c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.3 14.63 2.33 12 2.33a9.75 9.75 0 0 0-8.7 5.41l3.24 2.53C7.31 7.96 9.46 6.24 12 6.24z"/></svg>
<span>Continue with Google</span>
</button>
</div>

<p id="signupMessage" class="auth-message" role="status"></p>
<p class="auth-sub">Already have an account?</p>
<a class="create-account-link" href="login.html" style="font-size:14px;margin-top:2px;">Sign in</a>
</section>
<script src="firebase-config.js"></script><script type="module" src="signup.js"></script>
</body></html>
