<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sign up — CropPulse</title>
<link rel="icon" type="image/png" href="favicon.png?v=3"> <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<section class="auth-card">
<a class="auth-brand" href="index.html"><img src="assets/logo.png" alt="CropPulse"><span>Crop<span style="color:var(--green)">Pulse</span></span></a>
<h1 class="auth-title">Create your CropPulse account</h1>
<p class="auth-sub">Set up your field intelligence workspace.</p>

<div id="signupForm">
<label class="auth-label">Username</label>
<input id="signupUsername" class="auth-input" type="text" placeholder="Choose a username" autocomplete="username">

<label class="auth-label">Email ID</label>
<input id="signupEmail" class="auth-input" type="email" placeholder="you@example.com" autocomplete="email">

<label class="auth-label">Mobile number</label>
<div class="phone-row">
<select id="signupCountry" class="auth-input"><option value="+91">+91</option><option value="+1">+1</option><option value="+44">+44</option><option value="+61">+61</option></select>
<input id="signupPhone" class="auth-input" inputmode="tel" placeholder="9876543210" autocomplete="tel">
</div>

<label class="auth-label">Set a password</label>
<input id="signupPassword" class="auth-input" type="password" placeholder="At least 6 characters" autocomplete="new-password">

<label class="terms-check"><input id="terms" type="checkbox"> <span>I accept the <a href="terms.html" target="_blank">Terms and Conditions</a>.</span></label>

<div id="signupRecaptcha" class="recaptcha-wrap"></div>
<button id="signupSendOtp" class="btn btn-primary auth-btn">Send OTP to mobile</button>
</div>

<div id="signupOtpBox" class="otp-area" hidden>
<label class="auth-label">Mobile OTP</label>
<input id="signupOtp" class="auth-input" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" autocomplete="one-time-code">
<p class="otp-hint">Verify your mobile number to finish creating the account.</p>
<button id="signupVerifyOtp" class="btn btn-primary auth-btn">Verify & create account</button>
<a href="#" id="signupChange" class="back-link">← Change details</a>
</div>

<div class="auth-divider">OR</div>
<button id="signupGoogle" class="btn google-btn">Continue with Google</button>

<p id="signupMessage" class="auth-message" role="status"></p>
<p class="auth-sub">Already have an account? <a class="back-link" href="login.html">Sign in</a></p>
</section>
<script src="firebase-config.js"></script>
<script type="module" src="signup.js"></script>
</body></html>
